server {
    listen ${PORT};
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de seguridad ──────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # ── MinIO presigned URLs (path-style: /<bucket>/<key>?X-Amz-…) ─
    # El SDK firma con el host público; nginx lo reenvía a MinIO local
    # conservando el Host header para que la firma sea válida.
    location ~ ^/(messenger-archivos|messenger-avatars)/ {
        proxy_pass http://localhost:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_request_buffering            off;
        client_max_body_size               105m;
    }

    # ── REST API → Spring Boot local ───────────────────────────────
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 105m;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── WebSocket STOMP ─────────────────────────────────────────────
    location /ws {
        proxy_pass http://localhost:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── SockJS fallback ─────────────────────────────────────────────
    location /ws-sockjs/ {
        proxy_pass http://localhost:8080/ws-sockjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ── Angular SPA ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
