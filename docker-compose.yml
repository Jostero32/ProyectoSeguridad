version: '3.8'

# ════════════════════════════════════════════════════════════════════
#  ProyectoSeguridad – Stack completo (frontend + backend)
#
#  Uso:
#    1. Copia .env.example → .env y rellena los secretos
#    2. docker compose up --build
#
#  Puertos expuestos al host:
#    4200  → Frontend Angular  (nginx-frontend)
#    8080  → Backend Spring Boot
#    9000  → MinIO S3 API      (nginx)
#    9001  → MinIO Console
# ════════════════════════════════════════════════════════════════════

services:

  # ── Base de datos ─────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       messenger_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Almacenamiento de objetos ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Proxy nginx delante de MinIO.
  # IMPORTANTE: el nombre del servicio debe ser "nginx" para que coincida
  # con el Host header que reescribe nginx.conf (proxy_set_header Host nginx:9000).
  # AWS Signature V4 incluye el Host en la firma; si difieren → 403.
  nginx:
    image: nginx:alpine
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola web
    volumes:
      - ./ProyectoSeguridadBackend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend Spring Boot ───────────────────────────────────────────
  backend:
    build: ./ProyectoSeguridadBackend
    ports:
      - "8080:8080"
    environment:
      # Base de datos
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/messenger_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      # MinIO: Spring firma con Host nginx:9000; el nginx.conf lo reescribe igual
      STORAGE_ENDPOINT:       http://nginx:9000
      STORAGE_PUBLIC_URL:     http://localhost:9000
      STORAGE_ACCESS_KEY:     ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY:     ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET:         messenger-archivos
      STORAGE_BUCKET_AVATARS: messenger-avatars

      # ── Capa 1: Cifrado de base de datos (AES-GCM) ──────────────
      MESSENGER_DB_CRYPTO_ALGORITHM: ${MESSENGER_DB_CRYPTO_ALGORITHM:-AES_GCM}
      MESSENGER_DB_CRYPTO_SECRET:    ${MESSENGER_DB_CRYPTO_SECRET}

      # ── Capa 2: Cifrado back↔front REST (DES-CBC) ───────────────
      MESSENGER_API_CRYPTO_ALGORITHM: ${MESSENGER_API_CRYPTO_ALGORITHM:-DES_CBC}
      MESSENGER_API_CRYPTO_SECRET:    ${MESSENGER_API_CRYPTO_SECRET}

      # ── Capa 3: Cifrado WebSocket STOMP (ChaCha20) ──────────────
      MESSENGER_WS_CRYPTO_ALGORITHM: ${MESSENGER_WS_CRYPTO_ALGORITHM:-CHACHA20}
      MESSENGER_WS_CRYPTO_SECRET:    ${MESSENGER_WS_CRYPTO_SECRET}

      # Correo SMTP
      MAIL_HOST:          ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:          ${MAIL_PORT:-587}
      MAIL_USERNAME:      ${MAIL_USERNAME}
      MAIL_PASSWORD:      ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH:     ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}

      FRONTEND_RESET_PASSWORD_URL:   ${FRONTEND_RESET_PASSWORD_URL:-http://localhost:4200/auth/restablecer-password}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-15}

    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api-docs > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ── Frontend Angular (nginx sirve estáticos y proxea al backend) ──
  frontend:
    build:
      context: ./ProyectoSeguridadFrontend
      dockerfile: Dockerfile
      args:
        NG_APP_API_BASE_URL:  /api
        NG_APP_WS_URL:        /ws
        NG_APP_SOCK_JS_URL:   /ws-sockjs

        # ── Capa 2: secreto compartido back↔front (DES-CBC) ───────
        NG_APP_API_CRYPTO_ALGORITHM: ${MESSENGER_API_CRYPTO_ALGORITHM:-DES_CBC}
        NG_APP_API_CRYPTO_SECRET:    ${MESSENGER_API_CRYPTO_SECRET}

        # ── Capa 3: secreto compartido WebSocket (ChaCha20) ───────
        NG_APP_WS_CRYPTO_ALGORITHM: ${MESSENGER_WS_CRYPTO_ALGORITHM:-CHACHA20}
        NG_APP_WS_CRYPTO_SECRET:    ${MESSENGER_WS_CRYPTO_SECRET}

    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
