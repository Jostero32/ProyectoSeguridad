server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Oculta la versión de nginx
    server_tokens off;

    # ── Cabeceras de seguridad (OWASP) ────────────────────────────────
    # HSTS: fuerza HTTPS durante 2 años (el proxy/CDN lo verá en HTTPS)
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;

    # Impide que el navegador haga MIME-sniffing
    add_header X-Content-Type-Options     "nosniff" always;

    # Bloquea iframes desde cualquier origen (anti-clickjacking)
    add_header X-Frame-Options            "DENY" always;

    # Política de referrer segura
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Deshabilita APIs sensibles del navegador
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # CSP para la SPA Angular:
    #   - script-src 'self'              → solo JS del propio origen
    #   - style-src  'self' + googleapis → hojas propias + Google Fonts
    #   - font-src   gstatic             → archivos de fuente de Google
    #   - img-src    'self' data: blob:  → imágenes propias, data-URI y blobs (avatares)
    #   - connect-src ws: wss:           → WebSocket (STOMP)
    #   - frame-ancestors 'none'         → no embebible en iframes (anti-clickjacking)
    #   - object-src 'none'              → deshabilita plugins Flash / Java Applets
    # connect-src usa 'self' para cubrir WebSocket al mismo origen (ws/wss via nginx).
    # style-src omite 'unsafe-inline': Angular prod (AOT+esbuild) extrae estilos a .css.
    #   Si usas @angular/animations o bindings [style.x], añade 'unsafe-inline' aquí.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Angular SPA: todas las rutas desconocidas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Capa 2: REST API → backend (quita el prefijo /api) ────────────
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 105m;

        # Elimina cabeceras que revelan tecnología del backend
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Capa 3: WebSocket STOMP ────────────────────────────────────────
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # SockJS (fallback HTTP long-polling del WebSocket)
    location /ws-sockjs/ {
        proxy_pass http://backend:8080/ws-sockjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
