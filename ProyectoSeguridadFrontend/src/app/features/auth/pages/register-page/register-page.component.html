<form
  class="auth-card relative w-full max-w-[560px] overflow-hidden rounded-[34px] border border-white/10 bg-[#0d0d19]/90 p-6 text-white shadow-[0_30px_100px_rgba(0,0,0,0.45)] backdrop-blur-2xl sm:p-8"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-36 bg-gradient-to-br from-pink-500/25 via-fuchsia-500/15 to-violet-600/10"
  ></div>

  <div class="relative">
    <!-- Header móvil -->
    <div class="mb-7 flex items-center gap-4 lg:hidden">
      <div
        class="grid h-14 w-14 shrink-0 place-items-center rounded-[22px] bg-gradient-to-br from-pink-500 via-fuchsia-500 to-violet-600 text-white shadow-[0_16px_45px_rgba(217,70,239,0.35)]"
      >
        <span class="material-symbols-outlined text-[30px]">forum</span>
      </div>

      <div>
        <h1 class="text-xl font-black tracking-[-0.04em] text-white">Messenger Seguro</h1>
        <p class="text-sm text-slate-400">Crea tu cuenta</p>
      </div>
    </div>

    <!-- Header -->
    <div class="text-center">
      <div
        class="mx-auto grid h-[72px] w-[72px] place-items-center rounded-[26px] bg-gradient-to-br from-pink-500 via-fuchsia-500 to-violet-600 text-white shadow-[0_18px_55px_rgba(217,70,239,0.38)]"
      >
        <span class="material-symbols-outlined text-[36px]">person_add</span>
      </div>

      <div class="mt-5">
        <h2 class="text-3xl font-black tracking-[-0.055em] text-white">Crear cuenta</h2>

        <p class="mt-2 text-sm leading-6 text-slate-400">
          Regístrate para empezar a conversar de forma segura.
        </p>
      </div>
    </div>

    <!-- Mensajes -->
    @if (errorMessage()) {
      <div
        class="mt-6 flex items-start gap-3 rounded-[20px] border border-red-400/20 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-200"
      >
        <span class="material-symbols-outlined mt-0.5 text-[20px]">error</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div
        class="mt-6 flex items-start gap-3 rounded-[20px] border border-emerald-400/20 bg-emerald-500/10 px-4 py-3 text-sm font-semibold text-emerald-200"
      >
        <span class="material-symbols-outlined mt-0.5 text-[20px]"> check_circle </span>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <!-- Nombres / Apellidos -->
    <div class="mt-7 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Nombres </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('nombres')"
          [class.border-white/10]="!fieldInvalid('nombres')"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500"> badge </span>

          <input
            class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
            type="text"
            formControlName="nombres"
            placeholder="Bryan"
            autocomplete="given-name"
          />
        </div>

        @if (fieldInvalid('nombres')) {
          <p class="mt-2 text-xs font-bold text-red-300">Ingresa tus nombres.</p>
        }
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Apellidos </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('apellidos')"
          [class.border-white/10]="!fieldInvalid('apellidos')"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500"> person </span>

          <input
            class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
            type="text"
            formControlName="apellidos"
            placeholder="López"
            autocomplete="family-name"
          />
        </div>

        @if (fieldInvalid('apellidos')) {
          <p class="mt-2 text-xs font-bold text-red-300">Ingresa tus apellidos.</p>
        }
      </label>
    </div>

    <!-- Fecha / Username -->
    <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Fecha de nacimiento </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('fechaNacimiento')"
          [class.border-white/10]="!fieldInvalid('fechaNacimiento')"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500"> calendar_month </span>

          <input
            class="dark-date-input h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none"
            type="date"
            formControlName="fechaNacimiento"
          />
        </div>

        @if (fieldInvalid('fechaNacimiento')) {
          <p class="mt-2 text-xs font-bold text-red-300">Selecciona tu fecha de nacimiento.</p>
        }
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Usuario </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('username')"
          [class.border-white/10]="!fieldInvalid('username')"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500">
            alternate_email
          </span>

          <input
            class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
            type="text"
            formControlName="username"
            placeholder="bryan_dev"
            autocomplete="username"
          />
        </div>

        @if (fieldInvalid('username')) {
          <p class="mt-2 text-xs font-bold text-red-300">
            El usuario debe tener al menos 3 caracteres.
          </p>
        }
      </label>
    </div>

    <!-- Email -->
    <label class="mt-4 block">
      <span class="mb-2 block text-sm font-black text-slate-200"> Correo electrónico </span>

      <div
        class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
        [class.border-red-300]="fieldInvalid('email')"
        [class.border-white/10]="!fieldInvalid('email')"
      >
        <span class="material-symbols-outlined text-[22px] text-slate-500"> mail </span>

        <input
          class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      @if (fieldInvalid('email')) {
        <p class="mt-2 text-xs font-bold text-red-300">Ingresa un correo válido.</p>
      }
    </label>

    <!-- Passwords -->
    <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Contraseña </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('password')"
          [class.border-white/10]="!fieldInvalid('password')"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500"> lock </span>

          <input
            class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="grid h-9 w-9 place-items-center rounded-full text-slate-400 transition hover:bg-white/10 hover:text-white"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña"
          >
            <span class="material-symbols-outlined text-[21px]">
              {{ passwordVisible() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>

        @if (fieldInvalid('password')) {
          <p class="mt-2 text-xs font-bold text-red-300">
            La contraseña debe tener mínimo 8 caracteres.
          </p>
        }
      </label>

      <label class="block">
        <span class="mb-2 block text-sm font-black text-slate-200"> Confirmar </span>

        <div
          class="flex h-14 items-center gap-3 rounded-[20px] border bg-white/[0.06] px-4 transition-all duration-200 focus-within:border-pink-400/70 focus-within:bg-white/[0.09] focus-within:shadow-[0_0_0_4px_rgba(236,72,153,0.14)]"
          [class.border-red-300]="fieldInvalid('confirmPassword') || passwordsDoNotMatch()"
          [class.border-white/10]="!fieldInvalid('confirmPassword') && !passwordsDoNotMatch()"
        >
          <span class="material-symbols-outlined text-[22px] text-slate-500"> verified_user </span>

          <input
            class="h-full min-w-0 flex-1 bg-transparent text-[15px] font-semibold text-white outline-none placeholder:text-slate-500"
            [type]="confirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Repite contraseña"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="grid h-9 w-9 place-items-center rounded-full text-slate-400 transition hover:bg-white/10 hover:text-white"
            (click)="toggleConfirmPasswordVisibility()"
            aria-label="Mostrar u ocultar confirmación"
          >
            <span class="material-symbols-outlined text-[21px]">
              {{ confirmPasswordVisible() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>

        @if (passwordsDoNotMatch()) {
          <p class="mt-2 text-xs font-bold text-red-300">Las contraseñas no coinciden.</p>
        }
      </label>
    </div>

    <button
      class="mt-7 flex h-14 w-full items-center justify-center gap-2 rounded-full bg-gradient-to-br from-pink-500 via-fuchsia-500 to-violet-600 text-sm font-black text-white shadow-[0_20px_50px_rgba(217,70,239,0.35)] transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_24px_60px_rgba(217,70,239,0.45)] disabled:translate-y-0 disabled:cursor-not-allowed disabled:opacity-70"
      type="submit"
      [disabled]="!canSubmit()"
    >
      @if (loading()) {
        <span
          class="h-5 w-5 animate-spin rounded-full border-[3px] border-white/40 border-t-white"
        ></span>
        Creando cuenta...
      } @else {
        <span class="material-symbols-outlined text-[22px]">person_add</span>
        Crear cuenta
      }
    </button>

    <p class="mt-6 text-center text-sm text-slate-400">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="font-black text-pink-300 transition hover:text-pink-200">
        Iniciar sesión
      </a>
    </p>
  </div>
</form>
