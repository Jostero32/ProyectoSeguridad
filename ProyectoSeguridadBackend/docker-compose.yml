version: '3.8'

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # No ports exposed to host - only nginx reaches MinIO
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "9000:9000"   # S3 API - external clients access here
      - "9001:9001"   # MinIO console
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messenger_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Spring Boot talks to nginx, nginx proxies to minio
      STORAGE_ENDPOINT: http://nginx:9000
      # Public URL seen by external clients
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: messenger-archivos
      STORAGE_BUCKET_AVATARS: messenger-avatars
      # Capa 1: Cifrado de base de datos (AES-GCM)
      MESSENGER_DB_CRYPTO_ALGORITHM: ${MESSENGER_DB_CRYPTO_ALGORITHM:-AES_GCM}
      MESSENGER_DB_CRYPTO_SECRET: ${MESSENGER_DB_CRYPTO_SECRET}
      # Capa 2: Cifrado back↔front REST (DES-CBC)
      MESSENGER_API_CRYPTO_ALGORITHM: ${MESSENGER_API_CRYPTO_ALGORITHM:-DES_CBC}
      MESSENGER_API_CRYPTO_SECRET: ${MESSENGER_API_CRYPTO_SECRET}
      # Capa 3: Cifrado WebSocket STOMP (ChaCha20)
      MESSENGER_WS_CRYPTO_ALGORITHM: ${MESSENGER_WS_CRYPTO_ALGORITHM:-CHACHA20}
      MESSENGER_WS_CRYPTO_SECRET: ${MESSENGER_WS_CRYPTO_SECRET}
      # Gmail SMTP — credenciales desde .env (NUNCA en repo)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL:-http://localhost:4200/auth/restablecer-password}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
