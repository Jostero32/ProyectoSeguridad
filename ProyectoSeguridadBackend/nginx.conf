events {
    worker_connections 1024;
}

http {
    # Resolver de Docker: resuelve hostnames en tiempo de request, no al arrancar.
    # Esto evita "host not found in upstream" cuando minio aún no está en DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy for MinIO S3 API
    server {
        listen 9000;

        # Allow large uploads
        client_max_body_size 110m;

        location / {
            # Variable → nginx resuelve minio en cada request (no en startup)
            set $minio_upstream http://minio:9000;
            proxy_pass $minio_upstream;

            # Fixed Host must match the endpoint used for signing.
            # AWS Signature V4 incluye Host en la firma; debe coincidir con
            # el nombre del servicio nginx en docker-compose (STORAGE_ENDPOINT).
            proxy_set_header Host nginx:9000;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Needed for multipart uploads
            proxy_request_buffering off;

            # Timeouts for large files
            proxy_connect_timeout 300;
            proxy_send_timeout    300;
            proxy_read_timeout    300;
        }
    }

    # Proxy for MinIO web console
    server {
        listen 9001;

        location / {
            set $minio_console http://minio:9001;
            proxy_pass $minio_console;

            proxy_set_header Host $http_host;

            # WebSocket support for the console
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
