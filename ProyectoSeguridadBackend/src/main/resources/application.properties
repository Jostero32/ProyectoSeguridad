spring.application.name=Messenger

# Oculta la cabecera "Server: Apache-Coyote" de Tomcat
server.server-header=


spring.datasource.url=jdbc:postgresql://localhost:5432/messenger_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cifrado de columnas sensibles en base.
# Opciones: AES_GCM, DES_CBC, CHACHA20_POLY1305. DES_CBC queda solo por requisito/compatibilidad.
messenger.db.crypto.algorithm=${MESSENGER_DB_CRYPTO_ALGORITHM:AES_GCM}
messenger.db.crypto.secret=${MESSENGER_DB_CRYPTO_SECRET:dev-only-change-this-db-crypto-secret}

# Cifrado de cuerpos JSON REST entre Angular y Spring.
# Opciones: AES_GCM, DES_CBC, CHACHA20.
messenger.api.crypto.algorithm=${MESSENGER_API_CRYPTO_ALGORITHM:DES_CBC}
messenger.api.crypto.secret=${MESSENGER_API_CRYPTO_SECRET:Secr3t8!}

# Cifrado manual de payloads STOMP/WebSocket.
# Opciones: AES_GCM, DES_CBC, CHACHA20.
messenger.ws.crypto.algorithm=${MESSENGER_WS_CRYPTO_ALGORITHM:AES_GCM}
messenger.ws.crypto.secret=${MESSENGER_WS_CRYPTO_SECRET:dev-only-change-this-ws-crypto-secret}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# MinIO storage
# endpoint   → URL interna desde Spring Boot a MinIO (subir, eliminar)
# public-url → URL con la que se firman las presigned URLs y las URLs de avatar
#              (debe ser resoluble por el cliente final)
# En dev local (Spring desde el IDE) ambos apuntan a localhost.
# En Docker, docker-compose sobreescribe storage.endpoint con el hostname interno.
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:9000}
storage.access-key=minioadmin
storage.secret-key=minioadmin
storage.bucket=messenger-archivos
storage.bucket-avatars=messenger-avatars

# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Mail (Gmail SMTP por defecto) — credenciales en variables de entorno, nunca en el repo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Recuperación de contraseña
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/auth/restablecer-password}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}
